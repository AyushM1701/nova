# Publishes a Nova release when a tag v<VERSION> is pushed. Only releases reach the Update button (core/update.py),
# so a commit on main reaches nobody until it's tagged. The zip's SHA256SUMS lets each install check its download.
#   git tag v1.5.4 && git push origin v1.5.4
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Build the downloads and their checksums
        run: |
          git archive --format=zip --prefix=nova-main/ -o nova-main.zip HEAD
          git archive --format=tar.gz --prefix=nova-main/ -o nova-main.tar.gz HEAD
          # the walkthrough's clips: left out of the zips above, fetched by core/walkthrough.py the first time it opens
          (cd docs/media/walkthrough && zip -q -X ../../../nova-walkthrough.zip ./*.mp4)
          sha256sum nova-main.zip nova-main.tar.gz nova-walkthrough.zip > SHA256SUMS

      # With the secret NOVA_RELEASE_KEY set (helpers/release_key.py makes it), SHA256SUMS is signed; once the matching
      # public key is RELEASE_KEY in core/update.py, an install accepts nothing that isn't signed.
      - name: Sign the checksums
        env:
          RELEASE_KEY: ${{ secrets.NOVA_RELEASE_KEY }}
        run: |
          if [ -n "$RELEASE_KEY" ]; then
            printf '%s\n' "$RELEASE_KEY" > release-key.pem
            openssl pkeyutl -sign -inkey release-key.pem -rawin -in SHA256SUMS -out SHA256SUMS.sig
            rm -f release-key.pem
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(nova-main.zip nova-main.tar.gz nova-walkthrough.zip SHA256SUMS)
          if [ -f SHA256SUMS.sig ]; then files+=(SHA256SUMS.sig); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Nova ${GITHUB_REF_NAME#v}" --generate-notes
