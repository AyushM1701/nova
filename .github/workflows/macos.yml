# Nova on a Mac with no one at it: installs the way setup does, runs the self-checks, then the macOS-only checks
# (helpers/check_mac.py). Permission prompts can't be clicked here, so those still need a person on a real Mac.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]  # Apple Silicon, macOS 14 and 15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # setup.sh accepts Python 3.11-3.13 with Tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Nova's libraries (as setup does)
        run: |
          python -c "import tkinter"
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --prefer-binary -r requirements.txt

      - name: Self-checks
        run: .venv/bin/python tests.py

      - name: macOS-only checks
        run: .venv/bin/python helpers/check_mac.py
