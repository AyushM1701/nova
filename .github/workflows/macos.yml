# Nova on a Mac with no one at it: installs the way setup does, runs the self-checks, then the macOS-only checks
# (helpers/check_mac.py). Permission prompts can't be clicked here, so those still need a person on a real Mac.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]  # Apple Silicon, macOS 15 and 26 (macOS 14 images are retired from 2026-11-02)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # setup.sh accepts Python 3.11-3.13 with Tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Nova's libraries (as setup does)
        run: |
          python -c "import tkinter"
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --disable-pip-version-check --prefer-binary -r requirements.txt

      # A look at the real window on this macOS (WKWebView): one picture per page, kept as a download of this run. It runs
      # before the checks because the checks open sockets, which makes macOS put a "local network" question over the screen.
      # It is for people to look at; if it cannot take pictures here, that must not fail the checks below.
      - name: Screenshots of the Nova window
        continue-on-error: true
        run: .venv/bin/python helpers/mac_screenshots.py shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-window-${{ matrix.os }}
          path: shots
          if-no-files-found: warn

      - name: Self-checks
        run: .venv/bin/python tests.py

      - name: macOS-only checks
        run: .venv/bin/python helpers/check_mac.py
