<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<style>
/* the same tokens as core/app.html; tests.py fails if they drift */
:root {
  --bg: #f6f6f8; --surface: #ffffff; --raised: #f1f1f5; --line: rgba(20, 20, 32, .09);
  --text: #16161a; --muted: #5b5b66; --faint: #6a6a74;
  --accent: #6a4cf5; --accent-ink: #ffffff; --accent-soft: rgba(106, 76, 245, .10);
  --amber: #8f5500; --amber-soft: rgba(255, 186, 60, .16); --amber-line: rgba(204, 132, 0, .45);
  --ok: #117a50;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --surface: #18181d; --raised: #1f1f25; --line: rgba(255, 255, 255, .07);
    --text: #f2f2f4; --muted: #a3a3ad; --faint: #80808b;
    --accent: #7357ff; --accent-ink: #ffffff; --accent-soft: rgba(124, 92, 255, .16);
    --amber: #ffba3c; --amber-soft: rgba(255, 186, 60, .10); --amber-line: rgba(255, 186, 60, .42);
    --ok: #3ecf8e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
       display: flex; flex-direction: column; min-width: 340px; min-height: 480px; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
header svg { width: 20px; height: 20px; }
header b { font-size: 14px; }
.state { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.dot.live { background: var(--ok); } .dot.busy { background: var(--accent); } .dot.ask { background: var(--amber); }
main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.msg { overflow-wrap: anywhere; white-space: pre-wrap; }
.user { align-self: flex-end; max-width: 85%; background: var(--accent-soft); padding: 7px 11px; border-radius: 14px 14px 4px 14px; }
.nova { color: var(--text); }
.note, .step { color: var(--faint); font-size: 12px; }
.step { font-family: "Cascadia Code", Consolas, ui-monospace, Menlo, monospace; border-left: 1px solid var(--line); padding-left: 10px; }
.ask { border: 1px solid var(--amber-line); background: var(--amber-soft); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
.ask b { color: var(--amber); }
.ask pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px "Cascadia Code", Consolas, ui-monospace, Menlo, monospace; background: var(--surface); padding: 8px 10px; border-radius: 8px; }
.ask .btns { display: flex; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 9px; padding: 6px 12px; background: var(--raised); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 260px; }
footer { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: flex-end; }
textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 18px;
           padding: 8px 13px; font: inherit; max-height: 120px; }
.round { width: 34px; height: 34px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; }
.round svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* Nova's mark: five sound bars that spell an "N" (core/icon.py draws the same). They rise into place when shown;
   html[data-nova] (the bar's state) makes them follow the mic while listening (--nv-l0..4, set by the page), roll a
   wave through while thinking, and bounce like a voice while talking */
.mark { display: block; flex: none; overflow: visible; }
.mark g rect { fill: url(#nv-ink); transform-box: fill-box; transform-origin: center;
  transition: transform .1s ease-out; animation: nv-rise .7s cubic-bezier(.3, 1.5, .5, 1) calc(var(--i) * .07s) backwards; }
.mark .nv-glow { filter: url(#nv-blur); opacity: .8; }
[data-nova="listening"] .mark g rect { transform: scaleY(calc(.4 + .75 * var(--l))); }
[data-nova="listening"] .mark .nv-glow { opacity: 1; }
[data-nova="thinking"] .mark g rect { animation: nv-wave 1.3s ease-in-out calc(var(--i) * -.16s) infinite; }
[data-nova="thinking"] .mark .nv-glow { animation: nv-breathe 1.3s ease-in-out infinite; }
[data-nova="speaking"] .mark g rect { animation: nv-talk var(--d) ease-in-out infinite alternate; }
[data-nova="approval"] .mark g rect { animation: nv-wave 2.2s ease-in-out calc(var(--i) * -.2s) infinite; }
[data-nova="paused"] .mark, [data-nova="gone"] .mark { filter: saturate(.2) brightness(.8); }
@keyframes nv-rise { from { transform: scaleY(.05); opacity: 0; } }
@keyframes nv-wave { 0%, 100% { transform: none; } 50% { transform: translateY(-2.5px) scaleY(.72); } }
@keyframes nv-talk { from { transform: scaleY(1.12); } to { transform: scaleY(.5); } }
@keyframes nv-breathe { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .mark * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="nv-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131528"/><stop offset="1" stop-color="#080a12"/></linearGradient><linearGradient id="nv-ink" gradientUnits="userSpaceOnUse" x1="8" y1="24" x2="40" y2="24"><stop offset="0.00" stop-color="#7b6dff"/><stop offset="0.31" stop-color="#5a8cff"/><stop offset="0.62" stop-color="#3fd6e6"/><stop offset="1.00" stop-color="#e0479a"/></linearGradient><filter id="nv-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter></defs></svg>
<header>
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="url(#nv-tile)"/><g class="nv-glow"><rect x="8.3" y="11" width="5" height="26" rx="2.5" style="--i:0;--d:0.42s;--l:var(--nv-l0,.5)"/><rect x="14.9" y="11.5" width="5" height="13" rx="2.5" style="--i:1;--d:0.34s;--l:var(--nv-l1,.5)"/><rect x="21.5" y="17.5" width="5" height="13" rx="2.5" style="--i:2;--d:0.5s;--l:var(--nv-l2,.5)"/><rect x="28.1" y="23.5" width="5" height="13" rx="2.5" style="--i:3;--d:0.38s;--l:var(--nv-l3,.5)"/><rect x="34.7" y="11" width="5" height="26" rx="2.5" style="--i:4;--d:0.46s;--l:var(--nv-l4,.5)"/></g><g class="nv-bars"><rect x="8.3" y="11" width="5" height="26" rx="2.5" style="--i:0;--d:0.42s;--l:var(--nv-l0,.5)"/><rect x="14.9" y="11.5" width="5" height="13" rx="2.5" style="--i:1;--d:0.34s;--l:var(--nv-l1,.5)"/><rect x="21.5" y="17.5" width="5" height="13" rx="2.5" style="--i:2;--d:0.5s;--l:var(--nv-l2,.5)"/><rect x="28.1" y="23.5" width="5" height="13" rx="2.5" style="--i:3;--d:0.38s;--l:var(--nv-l3,.5)"/><rect x="34.7" y="11" width="5" height="26" rx="2.5" style="--i:4;--d:0.46s;--l:var(--nv-l4,.5)"/></g></svg>
  <b>Nova</b>
  <span class="state"><i class="dot" id="dot"></i><span id="state">Connecting…</span></span>
</header>
<main id="log" aria-live="polite"></main>
<footer>
  <textarea id="input" rows="1" placeholder="Ask Nova…" aria-label="Message"></textarea>
  <button class="round" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
  <button class="round primary" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
</footer>
<script src="panel.js"></script>
</body>
</html>
