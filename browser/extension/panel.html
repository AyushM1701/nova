<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<style>
:root { --bg: #111114; --surface: #18181d; --raised: #1f1f25; --line: rgba(255,255,255,.08); --text: #f2f2f4; --muted: #a3a3ad;
        --faint: #80808b; --accent: #7357ff; --accent-soft: rgba(124,92,255,.16); --amber: #ffba3c; --ok: #3ecf8e; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
       display: flex; flex-direction: column; min-width: 340px; min-height: 480px; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
header svg { width: 20px; height: 20px; }
header b { font-size: 14px; }
.state { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.dot.live { background: var(--ok); } .dot.busy { background: var(--accent); } .dot.ask { background: var(--amber); }
main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.msg { overflow-wrap: anywhere; white-space: pre-wrap; }
.user { align-self: flex-end; max-width: 85%; background: var(--accent-soft); padding: 7px 11px; border-radius: 14px 14px 4px 14px; }
.nova { color: var(--text); }
.note, .step { color: var(--faint); font-size: 12px; }
.step { font-family: "Cascadia Code", Consolas, monospace; border-left: 1px solid var(--line); padding-left: 10px; }
.ask { border: 1px solid rgba(255,186,60,.42); background: rgba(255,186,60,.1); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
.ask b { color: var(--amber); }
.ask pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px "Cascadia Code", Consolas, monospace; background: var(--surface); padding: 8px 10px; border-radius: 8px; }
.ask .btns { display: flex; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 9px; padding: 6px 12px; background: var(--raised); }
button.primary { background: var(--accent); color: #fff; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 260px; }
footer { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: flex-end; }
textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 18px;
           padding: 8px 13px; font: inherit; max-height: 120px; }
.round { width: 34px; height: 34px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; }
.round svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#7c5cff"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg>
  <b>Nova</b>
  <span class="state"><i class="dot" id="dot"></i><span id="state">Connecting…</span></span>
</header>
<main id="log" aria-live="polite"></main>
<footer>
  <textarea id="input" rows="1" placeholder="Ask Nova…" aria-label="Message"></textarea>
  <button class="round" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
  <button class="round primary" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
</footer>
<script src="panel.js"></script>
</body>
</html>
